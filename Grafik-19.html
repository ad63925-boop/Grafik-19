<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="grafikstyle.css">
<link rel="stylesheet" href="../burgerMenu/menustyle.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/alarm.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3845/3845798.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<title>График охраны</title>
</head>
<body>

     <nav class="navbar">
        <div class="nav-container">
            <div class="nav-menu">
                <a href="profile.html" class="nav-link"><i class="fas fa-user"></i> Профиль</a>
                <button class="nav-logout" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> Выйти</button>
            </div>
        </div>
    </nav>
	
<!-- Бургер -->
<div class="burger" title="Меню">
  <span></span>
  <span></span>
  <span></span>
</div>

<!-- Правое меню -->
<div id="sideMenu" class="side-menu">
  <div id="menuItems"></div>

  <div class="menu-bottom" id="menuBottom"></div>
</div>


<hr>

<div id="a4">

<!-- Панель переключения месяцев -->
<div class="panelMonth">
    <button class="btn-graf" id="prevMonthBtn">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <input type="month" id="monthPicker" class="monthPicker"  value="">
    <button class="btn-graf" id="nextMonthBtn">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
    <button class="btn-graf" id="btnToDay" title="Сегодня">
      <i class="fa-solid fa-calendar-day"></i>
    </button>
	<button class="btn-graf" id="btnSetting" title="Настройки">
    <i class="fa-solid fa-gear"></i>
  </button>
      <button id="toggleViewBtn" class="btn-graf" title="Переключить вид графика">
        <i class="fa-regular fa-calendar-days"></i>
      </button>
</div>

<h2>График работы охраны Ш_19</h2>

<div class="table-wrapper">
    <table id="scheduleTable">
  <tr>
    <td class="schedule-loading">Загрузка графика...</td>
  </tr>
</table>
</div>

<br>
<!-- Блок с напоминаниями на завтра -->
<div id="tomorrowAlarmBox" class="tomorrow-alarm-box" hidden></div>

</div><!-- A4 конец-->

<!-- Заметки -->
<div id="notesSection" class="notes-section"> 

<h3 id="notesMonthTitle">Заметки</h3>
 
<div class="notes-toolbar">
  

    <button class="btn-graf" id="btnShowAllNotes">
    <i class="fa-solid fa-list"></i> Все
  </button>

  <button class="btn-graf" id="btnShowNoteForm">
    <i class="fa-regular fa-square-plus"></i> Добавить
  </button>
</div>

<div id="noteForm" class="note-form is-hidden">
  <div class="note-form-header">
    <span id="noteFormTitle">Новая заметка</span>
    <button class="note-close-btn" id="btnCloseNoteForm">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <textarea id="noteText" placeholder="Текст заметки"></textarea>

  <label for="noteReminderDate">Дата напоминания</label>
  <input type="date" id="noteReminderDate">

  <div class="note-form-actions">
    <button class="btn-graf" id="btnSaveNote">
      <i class="fa-solid fa-floppy-disk"></i> Сохранить
    </button>
  </div>
</div>

<div id="notesList" class="notes-list"></div>
</div>

<!-- График на одного охраника -->
<div id="calendarView" hidden>

  <div class="calendar-header">
    <select id="guardSelect"></select>
    <button id="prevMonth">
      <i class="fa-solid fa-angle-left"></i>
    </button>
    <span id="monthLabel" class="monthLabel"></span>
    <button id="nextMonth">
      <i class="fa-solid fa-angle-right"></i>
    </button>
  </div>

  <div class="calendar-grid" id="calendarGrid"></div>
</div>

<!-- Панель настроек -->
<div id="panelSeting" class="is-hidden">
	<div class="panel-header">
    <span><i class="fa-solid fa-gear"></i> Настройки</span>
</div>

<div class="panel">
<input type="text" id="newEmployeeName" class="inputNewName" placeholder="ФИО нового сотрудника...">
<button class="btn-graf" id="BtnAddEmployeeToList">
  <i class="fa-solid fa-plus"></i> Добавить в базу</button>
<br>
<select id="employeeSelect" class="selectName"></select>
<button class="btn-graf" id="btnAddEmployeeToTable"><i class="fa-solid fa-plus"></i> Добавить в график отдельно</button>
<button class="btn-graf" id="btnRemoveEmployeeFromList"><i class="fa-solid fa-trash"></i> Удалить сотрудника</button>
<hr>
<button class="btn-graf" id="btnShowEmployeesPanel"><i class="fa-solid fa-database"></i> База Сотрудников!</button>
<button class="btn-graf" id="btnClearShifts"><i class="fa-solid fa-broom"></i> Очистить смены</button>
</div>

<hr>

<div class="panel">
    <button id="screenshotBtn" class="btn-graf">
      <i class="fa-regular fa-images"></i> Скриншот графика</button>
</div>
<hr>
<!-- Шаблоны смен -->
<div class="panel">
    <button class="btn-graf" id="btnApplyTemplateForOne4">
      <i class="fa-solid fa-clone"></i> Шаблон 4д/2в</button>
    <button class="btn-graf" id="btnApplyTemplateForOne">
      <i class="fa-solid fa-clone"></i> Шаблон 2д/2в</button>
    <button class="btn-graf" id="btnShowapplyBatchShift">
      <i class="fa-regular fa-calendar-check"></i> Добавить смены</button>
</div>

<hr>

<!-- Экспорт и импорт -->
<div class="panel">
    <button class="btn-graf" id="btnExportData">
      <i class="fa-solid fa-file-export"></i> Экспорт</button>
    <button class="btn-graf" id="btnImportData">
      <i class="fa-solid fa-file-import"></i> Импорт</button>
    <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="importData(event)">
</div>
<hr>
	<div class="panel">
	<label for="printScale">Выберите размер печати:</label>
    <select id="printScale" class="printScale">
        <option value="0.6" selected>Маленький</option>
        <option value="0.8">Средний</option>
        <option value="1">Большой</option>
    </select>
    <label for="copiInput">Копии:</label>
    <input type="number" id="copiInput" class="printCopy" placeholder="1">
    <button class="btn-graf" id="btnPrintSchedule">
      <i class="fa-solid fa-print"></i> Печать</button>
	</div>
</div>


<!-- Назначение смен -->

<!-- Назначение смен по датам -->
<div id="batchShift" class="batch-shift-form">
  <h4>Назначение смен</h4>

  <!-- Выбор сотрудника -->
  <div style="margin: 10px 0;">
    <label>Сотрудник:</label><br>
    <select id="batchEmpSelect" class="batch-user-select">
      <!-- Опции заполняются JS -->
    </select>
  </div>

  <!-- Выбор смены -->
  <div style="margin: 10px 0;">
    <label>Смена:</label><br>
    <select id="batchShiftSelect" class="batch-shift-select">
      <!-- Опции заполняются из SHIFT_TYPES -->
    </select>
  </div>

  <!-- Выбор дат -->
  <div style="margin: 10px 0;">
    <label>Даты:</label><br>
    <div class="batch-calendar">
      <div class="batch-calendar-head">
        <span id="batchCalendarMonth"></span>
        <button type="button" id="btnClearBatchDates" title="Очистить выбор">
          <i class="fa-solid fa-eraser"></i>
        </button>
      </div>
      <div class="batch-calendar-weekdays">
        <span>Пн</span>
        <span>Вт</span>
        <span>Ср</span>
        <span>Чт</span>
        <span>Пт</span>
        <span>Сб</span>
        <span>Вс</span>
      </div>
      <div id="batchCalendarGrid" class="batch-calendar-grid"></div>
      <div id="batchSelectedDates" class="batch-selected-dates">Даты не выбраны</div>
    </div>
  </div>

  <div class="btn-set-close">
    <button id="btnApplyBatchShifts">✅ Применить</button>
    <button class="btn-closes" id="btnCloseBath">❌ Отмена</button>
  </div>

</div>

 <!-- График сотрудника -->
<section id="employeeCalendarSection" class="employee-calendar-section" hidden>
  <div class="employee-calendar-toolbar">
    
    <h3 id="employeeCalendarTitle">График на сотрудника</h3>
    
    <div>
      
      <input type="month" id="employeeCalendarMonthPicker" class="employee-calendar-month-picker">
      
      <select id="employeeCalendarSelect" class="employee-calendar-select"></select>
      
    </div>


  </div>

  <div id="employeeCalendarGrid" class="employee-calendar-grid"></div>
</section>

 <!-- База сотрудников -->
<div id="employeesPanel" class="panel-visible" style="margin-top:20px; padding:15px; border:1px solid #ccc; border-radius:8px;">

  <div class="employees-header">
    <span>База сотрудников</span>
    <button id="btnCloseEmployeesPanel">✖</button>
</div>
  <div id="employeesList"></div>
</div>

<div id="print-container" style="display: none;"></div>


	<script src="js/auth.js"></script>
	<script>
        // Защищаем страницу
        if (Auth.protectPage()) {
            // Обновляем интерфейс для авторизованного пользователя
            Auth.updateUI();
        }
    </script>
<!-- 1. Firebase SDK (compat-режим) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<!-- 2. Инициализация Firebase -->
<script src="js/firebase.js"></script>

<!-- 3. Вспомогательные библиотеки -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<!-- 4. Ваши модули (только после инициализации Firebase!) -->
<script src="database.js"></script>
<script src="render.js"></script>
<script src="employees.js"></script>
<script src="schedule.js"></script>
<script src="app.js"></script>
<script src="js/note.js"></script>
<script src="notify_alarm.js"></script>
<script src="calendar.js"></script>


<!-- 5. Меню (в конце, после всего основного кода) -->
<script src="../burgerMenu/menu.js" defer></script>


</body>
</html>
